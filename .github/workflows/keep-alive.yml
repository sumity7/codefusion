name: Keep Render backend awake

on:
  schedule:
    # Render's free tier spins the service down after 15 minutes idle.
    # Pinging every 10 minutes keeps it under that threshold even with
    # GitHub Actions' scheduling jitter.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS https://codefusion-f2yd.onrender.com/api/health
