<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aurora Commerce Card</title>
<style>
:root{--bg:#050507;--card:#0d0d12;--border:#262630;--border-soft:#1d1d25;--text:#f7f5fb;--muted:#85828e;--lavender-soft:#c4b5fd;--lavender-pale:#f0d9ff;--success:#9fd6ad;--radius:24px;--ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(circle at 50% 20%,rgba(155,138,255,.09),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;border:0}.aurora-card{width:min(100%,390px);position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 38%),var(--card);box-shadow:0 28px 70px rgba(0,0,0,.42),0 0 90px rgba(155,138,255,.035);transition:transform .35s var(--ease),border-color .35s var(--ease),box-shadow .35s var(--ease)}.aurora-card:hover{transform:translateY(-6px);border-color:#3c3948;box-shadow:0 40px 90px rgba(0,0,0,.50),0 0 90px rgba(155,138,255,.07)}.product-media{position:relative;min-height:275px;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 44%,rgba(196,181,253,.16),transparent 24%),radial-gradient(circle at 50% 50%,rgba(155,138,255,.08),transparent 52%),#0b0b10;border-bottom:1px solid var(--border-soft)}.product-media:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(155,138,255,.075);filter:blur(50px);z-index:-1}.product-media:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.025) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s var(--ease);pointer-events:none}.aurora-card:hover .product-media:after{transform:translateX(100%)}.badge{position:absolute;top:14px;left:14px;z-index:4;padding:6px 8px;border:1px solid #363442;border-radius:7px;background:rgba(15,14,20,.9);color:#bbb5c6;font-size:9px;line-height:1;letter-spacing:.8px;font-weight:700}.wishlist{position:absolute;top:13px;right:13px;z-index:5;width:34px;height:34px;display:grid;place-items:center;border:1px solid #302f39;border-radius:9px;background:rgba(12,12,16,.92);color:#85818d;cursor:pointer;transition:color .2s,border-color .2s,background .2s,transform .2s}.wishlist:hover{color:var(--lavender-soft);border-color:#4d485b;transform:translateY(-1px)}.wishlist.active{color:var(--lavender-pale);border-color:#655a80;background:#17131f}.wishlist svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.wishlist.active svg{fill:currentColor}.product-art{position:relative;width:154px;height:154px;display:grid;place-items:center;transition:transform .55s var(--ease),filter .55s var(--ease)}.aurora-card:hover .product-art{transform:scale(1.035) rotate(-1.5deg);filter:drop-shadow(0 22px 35px rgba(155,138,255,.12))}.product-art:before{content:"";position:absolute;inset:7%;border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);transform:rotate(8deg);box-shadow:inset 0 0 40px rgba(255,255,255,.02),0 28px 50px rgba(0,0,0,.28)}.product-art:after{content:"";position:absolute;width:105px;height:105px;border-radius:32px;background:radial-gradient(circle at 32% 25%,#f1edff 0%,#8c83a8 26%,#40394e 53%,#1e1b25 78%);transform:rotate(13deg);box-shadow:inset -18px -20px 30px rgba(0,0,0,.23),0 18px 45px rgba(0,0,0,.35)}.product-orbit{position:absolute;width:182px;height:74px;border:1px solid rgba(196,181,253,.3);border-radius:50%;transform:rotate(-20deg);z-index:2}.product-orbit:after{content:"";position:absolute;top:6px;left:28px;width:7px;height:7px;border-radius:50%;background:#d6cbff;box-shadow:0 0 18px rgba(196,181,253,.75)}.product-logo{position:absolute;z-index:3;display:grid;place-items:center;width:66px;height:66px;border-radius:19px;color:#f9f7ff;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(10px);box-shadow:inset 0 1px rgba(255,255,255,.08),0 18px 25px rgba(0,0,0,.28);font-size:24px;font-weight:700;letter-spacing:-.08em}.product-body{padding:22px}.product-category{margin:0 0 8px;color:#9b94a9;font-size:9px;line-height:1;letter-spacing:1.4px;font-weight:700;text-transform:uppercase}.product-name{margin:0;font-size:22px;line-height:1.12;letter-spacing:-.04em;font-weight:700}.product-description{margin:9px 0 17px;color:var(--muted);font-size:12px;line-height:1.65}.rating-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;color:#6d6975;font-size:9px}.rating-stars{color:var(--lavender-soft);letter-spacing:2px;font-size:10px}.price-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}.current-price{color:#fff;font-size:24px;line-height:1;letter-spacing:-.04em;font-weight:700}.old-price{color:#5f5c67;font-size:11px;text-decoration:line-through}.discount{padding:4px 6px;border:1px solid #40374f;border-radius:5px;color:var(--lavender-soft);background:#14111b;font-size:8px;line-height:1;font-weight:700}.purchase-area{margin-top:17px}.purchase-button{position:relative;width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;border:0;border-radius:11px;background:linear-gradient(135deg,#d8d1ff,#b8aaf6);color:#0b0910;cursor:pointer;font-size:11px;font-weight:800;box-shadow:0 12px 32px rgba(155,138,255,.1);transition:transform .2s,box-shadow .2s,filter .2s}.purchase-button:after{content:"";position:absolute;top:0;left:-120%;width:80%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);transition:left .7s var(--ease)}.purchase-button:hover:after{left:145%}.purchase-button:hover{transform:translateY(-2px);box-shadow:0 18px 45px rgba(155,138,255,.17);filter:brightness(1.03)}.purchase-button:active{transform:translateY(0)}.purchase-button.loading{pointer-events:none;background:#201d28;color:#aaa3b4;box-shadow:none}.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.22);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.purchase-button.success{pointer-events:none;background:#17231b;color:var(--success);border:1px solid #304c38;box-shadow:none}.purchase-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;color:#5e5b66;font-size:8px}.purchase-meta span{display:inline-flex;align-items:center;gap:4px}.purchase-meta span:before{content:"";width:3px;height:3px;border-radius:50%;background:#494652}button:focus-visible{outline:2px solid var(--lavender-soft);outline-offset:3px}@media(max-width:480px){body{padding:20px 14px}.aurora-card{width:100%;border-radius:21px}.product-media{min-height:245px}.product-body{padding:19px}.product-name{font-size:20px}.product-description{font-size:11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<article class="aurora-card" id="auroraCard"><div class="product-media"><span class="badge">EDITOR'S PICK</span><button class="wishlist" id="wishlistButton" type="button" aria-label="Add Aurora Commerce Card to wishlist" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button><div class="product-art" aria-hidden="true"><div class="product-orbit"></div><div class="product-logo">A</div></div></div><div class="product-body"><p class="product-category">Cards / Ecommerce</p><h1 class="product-name">Aurora Commerce Card</h1><p class="product-description">A conversion-focused product card with wishlist, price comparison and a refined purchase state.</p><div class="rating-row"><span class="rating-stars" aria-label="4.9 out of 5">★★★★★</span><span>4.9 · 86 reviews</span></div><div class="price-row"><strong class="current-price">₹2,999</strong><span class="old-price">₹4,999</span><span class="discount">40% OFF</span></div><div class="purchase-area"><button class="purchase-button" id="purchaseButton" type="button"><span class="button-text">Add to collection</span></button><div class="purchase-meta"><span>Responsive</span><span>HTML · CSS · JS</span><span>Ready to ship</span></div></div></div></article>
<script>
const card=document.getElementById("auroraCard"),wishlistButton=document.getElementById("wishlistButton"),purchaseButton=document.getElementById("purchaseButton"),buttonText=purchaseButton.querySelector(".button-text");
wishlistButton.addEventListener("click",()=>{const active=wishlistButton.classList.toggle("active");wishlistButton.setAttribute("aria-pressed",String(active));wishlistButton.setAttribute("aria-label",active?"Remove Aurora Commerce Card from wishlist":"Add Aurora Commerce Card to wishlist")});
purchaseButton.addEventListener("click",()=>{if(purchaseButton.classList.contains("loading")||purchaseButton.classList.contains("success"))return;purchaseButton.classList.add("loading");buttonText.innerHTML='<span class="spinner" aria-hidden="true"></span> Adding…';setTimeout(()=>{purchaseButton.classList.remove("loading");purchaseButton.classList.add("success");buttonText.textContent="Added ✓";setTimeout(()=>{purchaseButton.classList.remove("success");buttonText.textContent="Add to collection"},1800)},900)});
card.addEventListener("pointermove",e=>{if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`translateY(-6px) perspective(1000px) rotateX(${y*-2}deg) rotateY(${x*2}deg)`});
card.addEventListener("pointerleave",()=>{card.style.transform=""});
</script></body></html>
